name: CI

# The suite already existed and passed — 1770 tests, ~57s, zero runtime
# dependencies — and nothing had ever executed it automatically. This repo is
# installed as an editable package by the crews that use it, so `main` is what
# the next `git pull` becomes: a bad merge here reaches every consumer at once,
# not one service. That is the whole argument for running the tests on push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push while the first is still running should cancel the first: the
# only result anyone acts on is the one for the current tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The fleet runner advertises ubuntu-22.04 (plus deploy), not the GitHub
    # hosted-runner alias ubuntu-latest.  A non-matching label leaves every job
    # unassigned with task_id=0 until the next push cancels it.
    runs-on: ubuntu-22.04
    strategy:
      # Never stop the other versions because one failed — "3.11 broke" and
      # "every version broke" are different diagnoses and the matrix is the
      # only thing that can tell them apart.
      fail-fast: false
      matrix:
        # The declared floor (`requires-python = ">=3.11"`) through the version
        # the consuming hosts actually run. Testing only one end would let the
        # other rot silently: the floor is a promise to anyone installing on an
        # older interpreter, and the top is where the code actually executes.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `pip install -e .` installs the package and its console script. The
      # project declares no runtime dependencies, so pytest is the only extra.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # The version string is a hand-maintained constant in two files
      # (pyproject.toml and shantytown/__init__.py). They are kept in sync by
      # hand with no guard, so a bump that updates one and forgets the other
      # ships a CLI whose `--version` disagrees with its own package metadata.
      # Cheap to assert here; it is exactly the drift that made the static
      # version untrustworthy in the first place.
      - name: Version constants agree
        run: |
          python - <<'PY'
          import tomllib, pathlib, sys
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          import shantytown
          if shantytown.__version__ != pyproject:
              sys.exit(
                  f"version drift: pyproject.toml={pyproject!r} "
                  f"but shantytown.__version__={shantytown.__version__!r}"
              )
          print(f"version {pyproject} agrees in both places")
          PY

      - name: Test
        run: python -m pytest -q

      # A package that imports but whose entry point does not run is a broken
      # install that every test would still pass through, because the tests
      # import the modules directly rather than invoking the script.
      - name: Console script runs
        run: st --version

  # The `test` job above answers "is the suite green in one process?". That is
  # a weaker statement than it looks: the suite was measured (aegis-rig9vu) to
  # be order-dependent in BOTH directions -- tests that fail alone and pass in
  # the full run, and tests that pass alone and fail in it. While that was
  # true, a green `test` job was not evidence, because the full run concealed
  # two genuinely broken tests, and a red one was not attributable either.
  #
  # This job asserts the property `test` cannot: that a test's verdict does not
  # depend on what ran before it. It runs the suite whole, then every file
  # alone, and fails if the two disagree.
  #
  # ONE version, not the matrix. Coupling between tests is a property of the
  # code, not of the interpreter, so running it four times would buy four
  # copies of the same answer for four times the runtime. 3.14 is the version
  # the consuming hosts actually run.
  order-independence:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # Proves the detector's three findings paths (HIDDEN / INDUCED / FLAKY)
      # against a synthetic suite built for the purpose. A detector whose
      # finding path has never executed is not evidence of anything, and this
      # one reports success by staying silent -- exactly the shape that rots
      # unnoticed.
      - name: Detector selftest
        run: bash scripts/check-test-order-independence.sh --selftest

      - name: Suite is order-independent
        run: bash scripts/check-test-order-independence.sh

      # The scrub guard is the only thing standing between a public push and an
      # internal hostname, and its installer's 22 assertions were executed by
      # NOTHING until now -- not by CI, not by cron, not by a hook (aegis-n5b1rd).
      # They were run when a human remembered, which is the same coverage as none
      # on the day nobody does. Wiring it beside the detector selftest above for
      # the reason that comment already gives.
      - name: Scrub-guard installer selftest
        run: bash scripts/install-scrub-guard.sh --selftest
