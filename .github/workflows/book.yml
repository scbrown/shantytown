name: Book

on:
  push:
    branches: [main]
    paths: ["docs/**", "book.toml", ".github/workflows/book.yml"]
  pull_request:
    paths: ["docs/**", "book.toml", ".github/workflows/book.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

# The Pages deploy and the PR build checks must NOT share a group. A single
# `pages` group with cancel-in-progress let any docs PR cancel main's publish,
# and a main rerun cancel open PR checks (measured 2026-09-26, run 36216218263).
# Main publishes in its own group and is never cancelled mid-deploy; a PR build
# only supersedes older builds of the SAME PR.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('book-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build --dest-dir _book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
